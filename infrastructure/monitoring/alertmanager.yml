# Alertmanager Configuration
# Reference: https://prometheus.io/docs/alerting/latest/configuration/

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'

receivers:
  - name: 'default'
    # Configure email/Slack/PagerDuty receivers here
    # webhook_configs:
    #   - url: 'https://hooks.slack.com/services/...'
