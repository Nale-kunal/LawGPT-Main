# MongoDB Configuration for Juriq
# Reference: https://www.mongodb.com/docs/manual/reference/configuration-options/

storage:
  dbPath: /data/db
  journal:
    enabled: true

net:
  port: 27017
  bindIp: 0.0.0.0

operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 100

setParameter:
  enableLocalhostAuthBypass: false
