name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'docker-compose*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'docker-compose*.yml'

jobs:
  build-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t juriq-backend:test ./backend

      - name: Verify image
        run: docker image inspect juriq-backend:test

  build-frontend:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -t juriq-frontend:test --build-arg VITE_API_URL=/ ./frontend

      - name: Verify image
        run: docker image inspect juriq-frontend:test
